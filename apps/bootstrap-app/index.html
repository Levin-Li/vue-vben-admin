<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <!-- 临时平台授权参数清理前也不得通过资源请求的 Referer 泄露。 -->
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="description" content="A Modern Back-end Management System" />
    <meta name="keywords" content="Vben Admin Vue3 Vite" />
    <meta name="author" content="Vben" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />
    <!-- 由 vite 注入 VITE_APP_TITLE 变量，在 .env 文件内配置 -->
    <title><%= VITE_APP_TITLE %></title>
    <link rel="icon" href="/favicon.ico" />
    <script>
      // 绑定桥接页面含一次性平台授权参数，禁止统计脚本读取当前 URL。
      var authCallbackParams = new URLSearchParams(window.location.search);
      var hasAuthCallback = [
        'oauthBindCallback',
        'oauthInAppCode',
        'code',
        'auth_code',
        'authorization_code',
        'oauth_token',
        'oauth_verifier',
      ].some(function (key) {
        return authCallbackParams.has(key);
      });

      // 普通生产页面沿用既有统计入口。
      if (window._VBEN_ADMIN_PRO_APP_CONF_ && !hasAuthCallback) {
        var _hmt = _hmt || [];
        (function () {
          var hm = document.createElement('script');
          hm.src =
            'https://hm.baidu.com/hm.js?b38e689f40558f20a9a686d7f6f33edf';
          var s = document.getElementsByTagName('script')[0];
          s.parentNode.insertBefore(hm, s);
        })();
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
